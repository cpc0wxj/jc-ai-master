spring:
  application:
    name: jc-rag-kb

  # ========== 数据库 ==========
  datasource:
    url: jdbc:postgresql://127.0.0.1:15432/ragkb
    username: wxj
    password: 1111111a
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # ========== Redis ==========
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      password: 1111111a
      database: 1
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ========== 异步任务线程池 ==========
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
      thread-name-prefix: "index-task-"

  # ========== 文件上传限制 ==========
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # ========== Spring AI ==========
  ai:
    openai:
      # 使用 DashScope 的 OpenAI 兼容接口
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: sk-9e085308d2e644e99464c5bcb1ba8b49
      chat:
        options:
          model: qwen-plus
          temperature: 0.1      # RAG 场景用低温，减少幻觉
          max-tokens: 2048
      embedding:
        options:
          model: text-embedding-v3

# ========== MyBatis-Plus ==========
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 枚举默认用 name() 存取
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      id-type: auto               # 主键策略：数据库自增

# ========== MinIO ==========
minio:
  endpoint: http://127.0.0.1:19000
  access-key: wxj
  secret-key: 1111111a
  bucket: rag-documents

# ========== Reranker ==========
reranker:
  endpoint: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
  api-key: sk-9e085308d2e644e99464c5bcb1ba8b49
  model: gte-rerank-v2
  timeout-ms: 800       # 超时时间，超过则降级
  top-n: 5              # 精排后保留 Top 5

# ========== RAG 参数 ==========
rag:
  chunk:
    size: 512           # 每块最大字符数
    overlap: 64         # 相邻块重叠字符数
    structure-aware: false  # 是否启用结构感知分块（按段落/标题断点）
  retrieval:
    vector-top-k: 20    # 向量检索召回数量
    fulltext-top-k: 20  # 全文检索召回数量
    return-top-n: 5     # RRF 融合后最终返回的 chunk 数量
    min-score: 0.5      # 最低相似度阈值（低于此分数的 chunk 过滤掉）
  context:
    max-tokens: 3000    # 传给模型的最大 context Token 数
  cache:
    embedding-ttl: 7d   # Embedding 缓存有效期
    query-ttl: 10m      # 查询结果缓存有效期

# ========== Sa-Token ==========
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400        # Token 有效期 1 天
  is-concurrent: true
  is-share: false

# ========== 监控 ==========
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# ========== 日志 ==========
logging:
  level:
    com.jichi.ragkb: INFO
    org.springframework.ai: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"